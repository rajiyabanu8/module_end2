<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-in</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
  <style>
    body{
        background-color: #019EE3;
        display: flex;
        
    }
    
    .box{
        height: 427px;
        width: 50%;
        margin-top: 10%;
    }
    #box h1{
        
        text-align: center;
        
    }
    #box{
        
        background-color: white;
        
    }
    .box2{
        width: 90%;
        
    }

    /* Mobile */
@media (max-width: 576px) {
  body {
    flex-direction: column;
    align-items: center;
  }

  .box {
    width: 95%;
    margin-top: 20px;
    height: auto;   /* IMPORTANT */
  }

  .box h1 {
    font-size: 22px;
  }

  .box2 {
    width: 100%;
  }
}
    
  </style>
</head>
<body>
  
    <div class="box">
        <img src="https://content-whale.com/blog/wp-content/uploads/2023/11/Compelling-Narrative-for-Travel-Website-Content--1024x576.jpg" class="img-fluid" alt="Image not found">
    </div>
    
      <!-- form controls -->
<form id="userForm" class="box mx-auto p-5" autocomplete="off">

  <h1 class="text-primary text-center">Welcome</h1>
  <h6 class="text-center">Login with email</h6>

  <input type="hidden" id="userid"/>

  <div class="form-floating mb-3">
    <input type="email" class="form-control box2" id="floatingInput" placeholder="name@example.com" required>
    <label for="floatingInput">Email address</label>
  </div>

  <div class="form-floating mb-3">
    <input type="password" class="form-control box2" id="floatingPassword" placeholder="Password" required>
    <label for="floatingPassword">Password</label>
  </div>

  <div class="d-grid gap-2 col-6 mx-auto p-4">
    <!--submit button -->
    <button class="btn btn-primary" type="submit">Login</button>
  </div>

  <h6 class="text-center">
    Don't have an account? <a href="signup.html">Signup</a>
  </h6>

</form>


     <script src="login.js"></script>
</body>
</html>
