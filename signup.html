<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignupPage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

  <style>
     body{
        background-color: #019EE3;
        padding: 30px;
        
    }
    .box{
        background-color: white;
        border: solid 5px;
        margin: auto;
        width: 50%;
        padding: 10px;
    }
    .box h3{
        text-align: center;
    }
    .error-message{
    color:red;
    
}
  </style>
</head>
<body>
    <form id="userForm" name="regform" method="post"  class="row g-3">
        <input type="hidden" id="userid"/>
            <div class="box">
        <h3 style="color:#019EE3;">Sign Up</h3>
    <div class="row g-3">
  <div class="col">
    <label for="name" class="form-label" >Full Name</label>
    <input type="text" class="form-control" placeholder="Full name" aria-label="First name" id="name" required>
     <span id="name-error" class="error-message"></span>
  </div>

</div>
    <div class="col-md-12">
    <label for="mobilenumber" class="form-label">Mobile Number</label>
    <input type="tel" class="form-control" id="mobile" placeholder="Enter 10 digit mobile number" required >
    <span id="mobile-error" class="error-message"></span>
</div>
  <div class="col-md-12">
    <label for="inputEmail4" class="form-label">Email</label>
    <input type="email" class="form-control" id="email" placeholder="Enter ur mail" required>
    <span id="email-error" class="error-message"></span>
  </div>
  <div class="col-md-12">
    <label for="inputPassword4" class="form-label">Password</label>
    <!-- <input type="password" class="form-control" id="pwd" required>
    <span class="input-group-text" style="cursor:pointer;" onclick="togglePassword()">
      <i class="bi bi-eye" id="toggleIcon"></i>
    </span> -->
    <div class="input-group">
    <input type="password" class="form-control" id="pwd" placeholder="Enter password">
    <span class="input-group-text" style="cursor:pointer;" onclick="togglePassword('pwd','iconPwd')">
      <i class="bi bi-eye" id="iconPwd"></i>
    </span>
  </div>
    <span id="pwd-error" class="error-message"></span>
  </div>
  <div>
    <label class="form-label">Confirm Password </label>
    <!-- <input type="password" class="form-control" id="confpwd" required> -->
     <div class="input-group">
    <input type="password" class="form-control" id="confpwd" placeholder="Enter password">
    <span class="input-group-text" style="cursor:pointer;" onclick="togglePassword('confpwd','iconConfirm')">
      <i class="bi bi-eye" id="iconConfirm"></i>
    </span>
  </div>
    <span id="confpwd-error" class="error-message"></span>
  </div>
  <div class="col-12">
    <label for="inputAddress" class="form-label" >Address</label>
    <input type="text" class="form-control" id="address" placeholder="1234 Main St" required>
    <span id="address-error" class="error-message"></span>
  </div>
  
  <div class="col-md-6">
    <label for="inputCity" class="form-label" >City</label>
    <input type="text" class="form-control" id="city"  oninput="this.value = this.value.replace(/[^A-Za-z ]/g,'')"  required  >
    <span id="city-error" class="error-message"></span>
  </div>
    
  <div class="col-12">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="gridCheck">
      <label class="form-check-label" for="gridCheck">
        Check me out
      </label>
    </div>
  </div>
  <div class="col-12">
    <button type="submit" class="btn btn-primary" onclick="Validate()" >Submit</button>
    <button type="reset" class="btn btn-primary" value="reset">Reset</button>
   </div>
</form>
</div>
<script src="script1.js"></script>
</body>
</html>
